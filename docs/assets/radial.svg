<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="420" viewBox="0 0 1048 420" role="img" aria-labelledby="t d"><title id="t">Menu radial</title><desc id="d">Quatro fatias: Construir, Oco, Arestas e Preencher, e o painel com a tecla que cancela.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8466f"/><stop offset="1" stop-color="#f4a07a"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e8466f" stop-opacity="0.22"/><stop offset="1" stop-color="#e8466f" stop-opacity="0"/></radialGradient></defs><rect width="1048" height="420" fill="#0e1016"/><circle cx="300" cy="210" r="190" fill="url(#glow)"/><path d="M190.9,93.0 A160,160 0 0 1 409.1,93.0 L338.2,169.0 A56,56 0 0 0 261.8,169.0 Z" fill="#e8466f" fill-opacity="0.9" stroke="#e8466f" stroke-width="1.5"/><text x="300.0" y="94.0" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" font-size="12" font-weight="700" fill="#12141b" text-anchor="middle" letter-spacing="0">1</text><text x="300.0" y="114.0" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#12141b" text-anchor="middle" letter-spacing="0">Construir</text><path d="M417.0,100.9 A160,160 0 0 1 417.0,319.1 L341.0,248.2 A56,56 0 0 0 341.0,171.8 Z" fill="#181b24" fill-opacity="1" stroke="#2e2c37" stroke-width="1.5"/><text x="408.0" y="202.0" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" font-size="12" font-weight="700" fill="#f4a07a" text-anchor="middle" letter-spacing="0">2</text><text x="408.0" y="222.0" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#fbeee0" text-anchor="middle" letter-spacing="0">Oco</text><path d="M409.1,327.0 A160,160 0 0 1 190.9,327.0 L261.8,251.0 A56,56 0 0 0 338.2,251.0 Z" fill="#181b24" fill-opacity="1" stroke="#2e2c37" stroke-width="1.5"/><text x="300.0" y="310.0" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" font-size="12" font-weight="700" fill="#f4a07a" text-anchor="middle" letter-spacing="0">3</text><text x="300.0" y="330.0" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#fbeee0" text-anchor="middle" letter-spacing="0">Arestas</text><path d="M183.0,319.1 A160,160 0 0 1 183.0,100.9 L259.0,171.8 A56,56 0 0 0 259.0,248.2 Z" fill="#181b24" fill-opacity="1" stroke="#2e2c37" stroke-width="1.5"/><text x="192.0" y="202.0" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" font-size="12" font-weight="700" fill="#f4a07a" text-anchor="middle" letter-spacing="0">4</text><text x="192.0" y="222.0" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#fbeee0" text-anchor="middle" letter-spacing="0">Preencher</text><circle cx="300" cy="210" r="48" fill="#0e1016" stroke="#2e2c37" stroke-width="1.5"/><text x="300" y="208" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#fbeee0" text-anchor="middle" letter-spacing="0">ALT</text><text x="300" y="226" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" font-size="11" font-weight="400" fill="#a8a29e" text-anchor="middle" letter-spacing="0">toque</text><text x="580" y="92" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#fbeee0" text-anchor="start" letter-spacing="-0.5">Menu radial</text><text x="580" y="122" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a8a29e" text-anchor="start" letter-spacing="0">Toque ALT. Escolha com o clique ou com 1 a 4.</text><rect x="580" y="160" width="420" height="40" rx="10" fill="#181b24" stroke="#2e2c37"/><rect x="580" y="160" width="4" height="40" rx="2" fill="#e8466f"/><text x="600" y="185" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#fbeee0" text-anchor="start" letter-spacing="0">Construir</text><text x="700" y="185" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#a8a29e" text-anchor="start" letter-spacing="0">liga o pincel, respeita o tipo de cada área</text><rect x="580" y="212" width="420" height="40" rx="10" fill="#181b24" stroke="#2e2c37"/><rect x="580" y="212" width="4" height="40" rx="2" fill="#f4a07a"/><text x="600" y="237" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#fbeee0" text-anchor="start" letter-spacing="0">Oco</text><text x="700" y="237" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#a8a29e" text-anchor="start" letter-spacing="0">área nova, só a casca da caixa</text><rect x="580" y="264" width="420" height="40" rx="10" fill="#181b24" stroke="#2e2c37"/><rect x="580" y="264" width="4" height="40" rx="2" fill="#f4a07a"/><text x="600" y="289" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#fbeee0" text-anchor="start" letter-spacing="0">Arestas</text><text x="700" y="289" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#a8a29e" text-anchor="start" letter-spacing="0">área nova, só as arestas</text><rect x="580" y="316" width="420" height="40" rx="10" fill="#181b24" stroke="#2e2c37"/><rect x="580" y="316" width="4" height="40" rx="2" fill="#f4a07a"/><text x="600" y="341" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#fbeee0" text-anchor="start" letter-spacing="0">Preencher</text><text x="700" y="341" font-family="'Fira Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#a8a29e" text-anchor="start" letter-spacing="0">área nova, só marca o volume</text><rect x="580" y="376" width="420" height="1" fill="#2e2c37"/><text x="580" y="400" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#a8a29e" text-anchor="start" letter-spacing="0">ESC ou ALT de novo cancela</text></svg>